name: lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

  docs:
    runs-on: ubuntu-latest
    steps:
      # Full history, because the prerelease check below compares what the
      # README says against the tags that exist.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, zip
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # The install instructions name a prerelease, and a prerelease is exactly
      # the kind of thing that goes out of date the moment the next one ships -
      # it has already happened twice. Nobody notices reading their own words,
      # so this notices instead.
      #
      # It asks only that the README has not fallen behind. Being ahead of the
      # tags is not a fault but the normal state while a release is being
      # prepared: the version is written, committed, and only then tagged. An
      # earlier version of this check demanded the newest tag by name and would
      # have blocked exactly that.
      - name: The README has not fallen behind the prereleases
        run: |
          newest=$(git tag --list 'v*-*' --sort=-v:refname | head -n 1 | sed 's/^v//')

          if [ -z "$newest" ]; then
            echo "No prerelease tags; nothing to check."
            exit 0
          fi

          failed=0

          for old in $(git tag --list 'v*-*' --sort=-v:refname | tail -n +2 | sed 's/^v//'); do
            for file in README.md README.pl.md; do
              grep -qF "$old" "$file" && {
                echo "::error file=$file::names $old, which $newest has superseded"
                failed=1
              }
            done
          done

          if [ $failed -eq 0 ]; then
            echo "No superseded prerelease is named. Newest tag: $newest"
          fi

          exit $failed

      # docs/ is generated HTML that is committed, so the site and the README
      # can drift apart without anything saying so. Rebuilding and diffing is
      # the only thing that notices.
      - name: Documentation site is up to date
        run: |
          composer docs
          git diff --exit-code docs/ \
            || (echo "::error::docs/ is stale - run 'composer docs' and commit the result" && exit 1)

      # Nothing else keeps the translation in step with the original. Comparing
      # the shape catches a section added to one and not the other, which is
      # how they come apart in practice.
      - name: Both READMEs have the same shape
        run: |
          diff <(grep -oE '^#{2,4} ' README.md) <(grep -oE '^#{2,4} ' README.pl.md) \
            || (echo "::error::README.md and README.pl.md have different heading structures" && exit 1)
          for pattern in '^```' '^\| '; do
            en=$(grep -c "$pattern" README.md)
            pl=$(grep -c "$pattern" README.pl.md)
            [ "$en" = "$pl" ] \
              || (echo "::error::README.md has $en lines matching $pattern, README.pl.md has $pl" && exit 1)
          done
